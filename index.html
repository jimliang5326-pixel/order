<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下单 · 哈基蜂®牙椅器材</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#FFF8E1;margin:0;padding:18px;color:#1f2937}.wrap{max-width:520px;margin:0 auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 6px 24px rgba(0,0,0,.08)}h1{font-size:17px;margin:0 0 3px;color:#b45309}.sub{font-size:12px;color:#9ca3af;margin:0 0 14px}.sec{font-size:13px;font-weight:700;color:#374151;margin:0 0 10px}.search{width:100%;box-sizing:border-box;padding:11px;border:1px solid #e5e7eb;border-radius:10px;font-size:14px;margin-bottom:12px;font-family:inherit;outline:none}.search:focus{border-color:#1E3A8A}.card{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid #f0e6c8;border-radius:12px;margin-bottom:10px;cursor:pointer}.card:active{background:#FFFDF5}.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:0 0 56px;background:#FFF3CD}.ph{display:flex;align-items:center;justify-content:center;font-size:22px}.ci{flex:1;min-width:0}.cn{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cp{font-size:13px;color:#b45309;margin-top:3px}.go{flex:0 0 auto;background:#1E3A8A;color:#fff;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600}.empty{font-size:13px;color:#9ca3af;text-align:center;padding:22px 0}label{display:block;font-size:13px;color:#374151;margin-bottom:10px}input,textarea{width:100%;box-sizing:border-box;margin-top:4px;padding:10px;border:1px solid #e5e7eb;border-radius:10px;font-size:14px;font-family:inherit;outline:none}input:focus,textarea:focus{border-color:#1E3A8A}input[readonly]{background:#f8fafc;color:#475569}button{width:100%;padding:13px;border:none;border-radius:10px;background:#1E3A8A;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;font-family:inherit}.back{background:#fff;color:#1E3A8A;border:1px solid #cbd5e1;font-size:14px}#msg{margin-top:12px;font-size:13px;text-align:center;color:#1E3A8A;min-height:18px;line-height:1.6}</style></head><body><div class="wrap"><h1>哈基蜂®牙椅器材</h1><div class="sub">在线下单</div><div id="catView"><div class="sec">请选择产品</div><input id="catSearch" class="search" placeholder="搜索产品…"><div id="catList"></div><div id="catEmpty" class="empty" style="display:none;">暂无产品</div></div><form id="formView" style="display:none;"><div class="sec">填写下单信息</div><label>产品<input id="product" readonly></label><label>数量<input id="qty" type="number" min="1" value="1"></label><label>联系人<input id="contact" required></label><label>电话<input id="phone" required></label><label>地址<textarea id="address" required></textarea></label><label>备注<textarea id="remark"></textarea></label><button type="submit">提交订单</button><button type="button" class="back" id="backBtn" style="display:none;">← 返回产品列表</button></form><div id="msg"></div></div><script>var q=new URLSearchParams(location.search);var o=q.get("o")||"",u=q.get("u")||"",k=q.get("k")||"",p=q.get("p")||"",price=q.get("price")||"",ow=q.get("ow")||"",ok=q.get("ok")||"";function trimSlash(x){while(x.length&&x.charAt(x.length-1)==="/"){x=x.slice(0,x.length-1);}return x;}function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}var fv=document.getElementById("formView"),cv=document.getElementById("catView"),bk=document.getElementById("backBtn"),msg=document.getElementById("msg"),prodEl=document.getElementById("product"),qtyEl=document.getElementById("qty"),CAT=[],curName="";function showForm(name,pr){curName=name||"";prodEl.value=(name||"")+(pr?("  |  "+pr):"");qtyEl.value="1";cv.style.display="none";fv.style.display="";bk.style.display=p?"none":"block";msg.textContent="";window.scrollTo(0,0);}function showCatalog(){if(p){return;}fv.style.display="none";cv.style.display="";bk.style.display="none";msg.textContent="";window.scrollTo(0,0);}function renderCat(){var kw=(document.getElementById("catSearch").value||"").trim().toLowerCase();var el=document.getElementById("catList");var html="";for(var i=0;i<CAT.length;i++){var x=CAT[i];if(kw&&String(x.name).toLowerCase().indexOf(kw)===-1)continue;var img=x.img?("<img class='thumb' src='"+esc(x.img)+"' alt=''>"):"<div class='thumb ph'>🐝</div>";html+="<div class='card' data-i='"+i+"'>"+img+"<div class='ci'><div class='cn'>"+esc(x.name)+"</div>"+(x.price?"<div class='cp'>"+esc(x.price)+"</div>":"")+"</div><span class='go'>下单 ›</span></div>";}el.innerHTML=html;document.getElementById("catEmpty").style.display=(html?"none":"");var cs=el.querySelectorAll(".card");for(var m=0;m<cs.length;m++){(function(c){c.addEventListener("click",function(){var x=CAT[parseInt(c.getAttribute("data-i"),10)];if(x)showForm(x.name,x.price);});})(cs[m]);}}function loadCatalog(){if(!u||!k||!ok){if(p){showForm(p,price);}else{msg.textContent="请通过商家分享的链接打开本页";}return;}msg.textContent="加载产品…";var base=trimSlash(u);var url=base+"/rest/v1/products?deleted=eq.false&owner_key=eq."+encodeURIComponent(ok)+"&select=ext_id,name,price,data&order=ts.desc&limit=500";fetch(url,{headers:{apikey:k,Authorization:"Bearer "+k,"x-owner-key":ok}}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}).then(function(rows){CAT=[];(rows||[]).forEach(function(r){var nm=r.name||"";if(!nm)return;CAT.push({name:nm,price:r.price||"",img:(r.data&&r.data.imageUrl)?r.data.imageUrl:""});});msg.textContent="";if(!CAT.length){if(p){showForm(p,price);}else{cv.style.display="";fv.style.display="none";bk.style.display="none";document.getElementById("catEmpty").style.display="";document.getElementById("catEmpty").textContent="商家还没有上架产品";}return;}cv.style.display="";fv.style.display="none";bk.style.display="none";renderCat();}).catch(function(e){if(p){showForm(p,price);}else{msg.textContent="产品目录加载失败："+e.message;}});}document.getElementById("catSearch").addEventListener("input",renderCat);document.getElementById("formView").addEventListener("submit",async function(ev){ev.preventDefault();var body={product:curName||prodEl.value,qty:qtyEl.value,contact:document.getElementById("contact").value,phone:document.getElementById("phone").value,address:document.getElementById("address").value,remark:document.getElementById("remark").value,owner:ow,owner_key:ok};msg.textContent="提交中...";try{var r,base;if(o){base=trimSlash(o);r=await fetch(base+"/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});}else if(u&&k){base=trimSlash(u);r=await fetch(base+"/rest/v1/orders",{method:"POST",headers:{"Content-Type":"application/json",apikey:k,Authorization:"Bearer "+k,Prefer:"return=minimal"},body:JSON.stringify(body)});}else{msg.textContent="未配置云服务，请联系商家";return;}if(!r.ok)throw new Error("HTTP "+r.status);msg.textContent="下单成功，商家会尽快联系您";document.getElementById("formView").reset();if(CAT.length){setTimeout(showCatalog,1200);}else{prodEl.value=curName;}}catch(err){msg.textContent="提交失败："+err.message;}});if(p){showForm(p,price);}else{loadCatalog();}</script></body></html>
